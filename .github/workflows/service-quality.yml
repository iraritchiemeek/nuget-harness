name: service-quality

# Spec 02 done-when 8: every gate in docs/engineering-standards.md that a tool can enforce, on
# every push. Each step fails the build. CodeQL is in codeql.yml.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'specs/**']

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }} # get-snapshot.ps1 reads the snapshots-v1 release
  # Testcontainers' resource reaper (Ryuk) removes containers left by a crashed test run. A GitHub
  # runner is thrown away after the job, which removes them anyway, so Ryuk is off and its image,
  # which Testcontainers would pull by tag, is never pulled.
  TESTCONTAINERS_RYUK_DISABLED: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

defaults:
  run:
    working-directory: service

jobs:
  # Locked restore with NuGet audit, build with analyzers and warnings as errors, formatting,
  # unit and property tests, and integration tests against SQL Server restored from the seed snapshot.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: service/global.json

      - name: Restore in locked mode (lock files must match), with NuGet audit
        run: dotnet restore --locked-mode -warnaserror

      - name: No known-vulnerable package, transitive ones included
        run: |
          dotnet package list --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vulnerable.json"
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length' "$RUNNER_TEMP/vulnerable.json")
          echo "vulnerable packages: $count"
          test "$count" -eq 0

      - name: Build (analyzers, code style, warnings as errors)
        run: dotnet build --no-restore -c Release

      - name: CSharpier
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: dotnet format (style and analyzers; CSharpier owns whitespace)
        run: |
          dotnet format style --verify-no-changes --no-restore
          dotnet format analyzers --verify-no-changes --no-restore

      - name: Unit and property tests, with coverage
        run: >-
          dotnet test --no-build -c Release --project test/GalleryReadService.Tests
          --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml
          --results-directory "$RUNNER_TEMP/coverage"

      - name: Download the seed snapshot and check its digest
        working-directory: .
        shell: pwsh
        run: ./scripts/runner/get-snapshot.ps1 -State a -Dir "$env:RUNNER_TEMP/snapshot"

      - name: Integration tests (Testcontainers SQL Server, restored from the seed snapshot)
        env:
          SEED_SNAPSHOT_DIR: ${{ runner.temp }}/snapshot
        run: >-
          dotnet test --no-build -c Release --project test/GalleryReadService.IntegrationTests
          --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml
          --results-directory "$RUNNER_TEMP/coverage"

      # Coverage is reported, not gated: the mutation score is the gate (docs/engineering-standards.md).
      - name: Coverage summary
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/coverage/*.cobertura.xml; do
            rate=$(grep -o -m1 'line-rate="[0-9.]*"' "$f" | cut -d'"' -f2)
            echo "- coverage, $(basename "$f" .cobertura.xml) tests: line rate $rate of GalleryReadService" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage/*.cobertura.xml
          if-no-files-found: warn

  # Mutation testing of the whole service with both test projects. Fails below a score of 80
  # (src/GalleryReadService/stryker-config.json). The report is uploaded with every run.
  mutation-testing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: service/global.json

      - name: Download the seed snapshot and check its digest
        working-directory: .
        shell: pwsh
        run: ./scripts/runner/get-snapshot.ps1 -State a -Dir "$env:RUNNER_TEMP/snapshot"

      - name: Stryker.NET (break threshold 80)
        working-directory: service/src/GalleryReadService
        env:
          SEED_SNAPSHOT_DIR: ${{ runner.temp }}/snapshot
        run: |
          dotnet tool restore
          dotnet stryker --output "$RUNNER_TEMP/stryker"

      - name: Mutation score and surviving mutants
        if: always()
        working-directory: service
        run: |
          report=$(find "$RUNNER_TEMP/stryker" -name mutation-report.md | head -1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-report
          path: ${{ runner.temp }}/stryker
          if-no-files-found: warn
