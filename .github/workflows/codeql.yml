name: codeql

# Spec 02 done-when 8: CodeQL on every push, for the new service's C#. The analysis is uploaded to
# code scanning, and the job fails if it reports any result, because CodeQL alone does not fail
# a build on findings.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'specs/**']

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality
          config: |
            paths: [service]

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:csharp
          output: ${{ runner.temp }}/sarif

      - name: Fail on any result
        run: |
          count=$(jq '[.runs[].results[]] | length' "$RUNNER_TEMP"/sarif/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)  \(.message.text)"' "$RUNNER_TEMP"/sarif/*.sarif
          echo "CodeQL results: $count"
          test "$count" -eq 0
