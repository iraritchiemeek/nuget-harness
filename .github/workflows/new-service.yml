name: new-service

# Spec 02: the new read service, checked against the old app's recordings on Linux.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'specs/**']

permissions:
  contents: read
  actions: read # verify-recordings.ps1 reads the recording run and downloads its artifact

env:
  GH_TOKEN: ${{ github.token }}
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # Done-when 3 and 7, in both data states (amendment A2): restore the state's snapshot into SQL
  # Server, start the service as the read-only login, send every recorded request, and require
  # every record to match. The database fingerprint before and after must be identical.
  recordings:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        state: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # verify-recordings.ps1 reads who last committed recordings/
          persist-credentials: false

      - name: Database and service
        uses: ./.github/actions/service-under-test
        with:
          state: ${{ matrix.state }}

      - name: Verify the recordings against their manifest and the recording run
        shell: pwsh
        run: ./scripts/runner/verify-recordings.ps1

      - name: Send every recorded request, fingerprinting the database before and after
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          bash scripts/linux/db-fingerprint.sh > out/db-before.txt
          ./scripts/runner/capture.ps1 -Requests recordings/requests.txt -Dir out/new-service -Server http://localhost:5080
          bash scripts/linux/db-fingerprint.sh > out/db-after.txt

      - name: Check 7 (the service wrote nothing)
        shell: pwsh
        run: |
          . ./scripts/runner/common.ps1
          $before = Get-Content out/db-before.txt; $after = Get-Content out/db-after.txt
          $diff = @(Compare-Object $before $after -CaseSensitive)
          $diff | Format-Table -AutoSize | Out-String | Write-Host
          $ok = $before.Count -gt 0 -and $diff.Count -eq 0
          $detail = "state ${{ matrix.state }}: $($before.Count) fingerprint lines (row count and checksum of every table, SHA-256 of Packages and PackageRegistrations) identical before and after $(@(Get-Content out/new-service/_index.tsv).Count) requests"
          Write-Result 7 'the service wrote nothing' $ok $detail
          Write-Summary "- check 7: $(if ($ok) {'pass'} else {'FAIL'}) - $detail"
          if (-not $ok) { throw 'the database changed while the requests were sent' }

      - name: Check 3 (every recorded request matches)
        shell: pwsh
        run: >-
          ./scripts/runner/compare.ps1 -Before recordings/state-${{ matrix.state }} -After out/new-service
          -Exclusions recordings/parity-exclusions.txt -CheckNumber 3
          -Name 'state ${{ matrix.state }}: new service matches the recordings' -OutName spec02-check3-state-${{ matrix.state }}.txt

      - name: Service log
        if: always()
        run: cp "$RUNNER_TEMP/service.log" out/ 2>/dev/null || true

      - name: Secret scan of the outputs
        id: scan
        if: always()
        shell: pwsh
        run: ./scripts/runner/secret-scan.ps1 -Dir out

      - name: Upload outputs
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: new-service-state-${{ matrix.state }}
          path: out/
          if-no-files-found: warn

  # Done-when 4: the service answers from the database, not from the recordings. The recordings
  # are moved out of the checkout before the build; the published output and the container image
  # must hold none of them. The container then serves state A, change-data.sql changes the database
  # directly, and the affected responses must change exactly as the data says.
  data-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # verify-recordings.ps1 reads who last committed recordings/
          persist-credentials: false

      - name: Database (state A)
        uses: ./.github/actions/service-under-test
        with:
          state: a
          start-service: 'false'

      - name: Verify the recordings, then move them out of the checkout
        shell: pwsh
        run: |
          ./scripts/runner/verify-recordings.ps1
          Move-Item recordings "$env:RUNNER_TEMP/recordings"

      - name: Publish the service and its container image (from service/, so service/global.json picks the SDK)
        working-directory: service
        run: |
          dotnet --version
          dotnet publish src/GalleryReadService -c Release -o "$RUNNER_TEMP/publish"
          dotnet publish src/GalleryReadService -c Release --os linux --arch x64 /t:PublishContainer -p:ContainerImageTag=check4

      - name: Check 4, first half (no recording in the build output or the image)
        run: scripts/linux/no-recordings-in-build.sh "$RUNNER_TEMP/recordings" "$RUNNER_TEMP/publish" gallery-read-service:check4

      - name: Start the container as the read-only login
        run: |
          export Database__ConnectionString="Server=localhost,1433;Database=NuGetGallery;User Id=reader;Password=$READER_PASSWORD;TrustServerCertificate=True"
          docker run -d --name service --network host -e ASPNETCORE_HTTP_PORTS=5080 -e Database__ConnectionString gallery-read-service:check4
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5080/health > /dev/null; then echo 'service healthy'; exit 0; fi
            sleep 1
          done
          docker logs service; exit 1

      - name: Check 4, second half (change the database, check the responses)
        shell: pwsh
        run: ./scripts/linux/data-change-check.ps1 -Recorded "$env:RUNNER_TEMP/recordings/state-a"

      - name: Service log
        if: always()
        run: mkdir -p out && docker logs service > out/service.log 2>&1 || true

      - name: Secret scan of the outputs
        id: scan
        if: always()
        shell: pwsh
        run: ./scripts/runner/secret-scan.ps1 -Dir out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: new-service-data-change
          path: out/
          if-no-files-found: warn

  # Done-when 5: the comparator can fail, on the path check 3 takes (the recordings and the parity
  # exclusions). Four planted faults, each of which must be reported alone and for its reason.
  negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # verify-recordings.ps1 reads who last committed recordings/
          persist-credentials: false

      - name: Database (state A) and service
        uses: ./.github/actions/service-under-test
        with:
          state: a

      - name: Verify the recordings against their manifest and the recording run
        shell: pwsh
        run: ./scripts/runner/verify-recordings.ps1

      - name: Check 5 (planted faults, each reported alone and for its reason)
        shell: pwsh
        run: ./scripts/linux/negative-control.ps1

      - name: Secret scan of the outputs
        id: scan
        if: always()
        shell: pwsh
        run: ./scripts/runner/secret-scan.ps1 -Dir out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: new-service-negative-control
          path: out/
          if-no-files-found: warn
