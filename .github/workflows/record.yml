name: record

# Spec 02: record the old app's answers to recordings/requests.txt, in two data states. The pinned
# NuGetGallery runs on windows-2022.
#   State A: the spec 01 seed snapshot, from the snapshots-v1 release (scripts/runner/get-snapshot.ps1).
#   State B: state A plus the pushes in seed/state-b.txt (amendment A2), snapshotted as this run's
#            state-b-snapshot artifact and restored from it before recording.
# In each state the request set is sent twice, and the two passes must be byte-identical.
# Two jobs, so that the long one cannot write to the repository:
#   record  read-only. Records, assembles the recording and its manifest (write-manifest.ps1),
#           checks them, and uploads them as the artifact "recording": exactly the tree that is
#           committed as recordings/.
#   commit  checks the artifact again, adds the state B snapshot to the snapshots-v1 release, keeps
#           the recording as the asset of the release recordings-<run id> (artifacts expire; releases
#           don't), and commits the recording. verify-recordings.ps1 compares recordings/ with that
#           asset on every later run. Nothing else writes recordings/state-a, recordings/state-b or
#           the manifest.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the recording to main (off for an exploratory run)
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['recordings/requests.txt', 'recordings/ignored-headers.txt', 'recordings/parity-exclusions.txt', 'recordings/approved-differences.json', 'seed/state-b.txt']

permissions:
  contents: read

concurrency:
  group: record
  cancel-in-progress: false

env:
  GALLERY_SHA: 63e6ee4202b441e1c904d6f78fc7b070f36bc24f

jobs:
  record:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    env:
      GH_TOKEN: ${{ github.token }} # get-snapshot.ps1 reads the public snapshots-v1 release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the gallery, or restore it from cache
        uses: ./.github/actions/gallery-build
        with:
          gallery-sha: ${{ env.GALLERY_SHA }}

      - name: Setup (gallery tools\Setup-DevEnvironment.ps1)
        run: .\scripts\runner\setup.ps1

      - name: Download the seed snapshot and check its digest
        run: .\scripts\runner\get-snapshot.ps1 -State a -Dir snapshot

      - name: Restore the snapshot and start the app
        run: .\scripts\runner\reset.ps1 -Dir snapshot

      - name: 'State A: record twice and compare the passes'
        run: |
          .\scripts\runner\capture.ps1 -Requests recordings\requests.txt -Dir out\state-a\pass1
          .\scripts\runner\capture.ps1 -Requests recordings\requests.txt -Dir out\state-a\pass2
          .\scripts\runner\compare.ps1 -Before out\state-a\pass1 -After out\state-a\pass2 -CheckNumber 1 -Name 'state A: two recording passes are byte-identical' -OutName spec02-check1-passes-a.txt

      - name: 'State B: push seed/state-b.txt through the old app, snapshot, restore'
        run: |
          .\scripts\runner\push-state-b.ps1
          .\scripts\runner\snapshot.ps1 -Dir out\state-b-snapshot
          .\scripts\runner\secret-scan.ps1 -Dir out\state-b-snapshot
          .\scripts\runner\reset.ps1 -Dir out\state-b-snapshot

      - name: Upload the state B snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: state-b-snapshot
          path: out/state-b-snapshot/
          if-no-files-found: error

      - name: 'State B: record twice and compare the passes'
        run: |
          .\scripts\runner\capture.ps1 -Requests recordings\requests.txt -Dir out\state-b\pass1
          .\scripts\runner\capture.ps1 -Requests recordings\requests.txt -Dir out\state-b\pass2
          .\scripts\runner\compare.ps1 -Before out\state-b\pass1 -After out\state-b\pass2 -CheckNumber 1 -Name 'state B: two recording passes are byte-identical' -OutName spec02-check1-passes-b.txt

      - name: Save the SQL the old app sent (from the plan cache)
        run: .\scripts\runner\dump-sql.ps1 -OutFile out\old-app-sql.txt

      - name: Source and config diff of the old app
        run: .\scripts\runner\source-diff.ps1

      - name: Assemble the recording and its manifest, and check them
        run: |
          .\scripts\runner\write-manifest.ps1 -Out out\recording -StateA out\state-a\pass1 -StateB out\state-b\pass1 -Snapshot snapshot -StateBSnapshot out\state-b-snapshot
          .\scripts\runner\verify-recordings.ps1 -Dir out\recording -ThisRun

      - name: Diagnostics
        if: always()
        run: .\scripts\runner\diagnostics.ps1

      - name: Stop IIS Express
        if: always()
        run: .\scripts\runner\stop-site.ps1

      - name: Secret scan of the outputs
        id: scan
        if: always()
        run: .\scripts\runner\secret-scan.ps1 -Dir out

      - name: Upload the recording
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recording
          path: out/recording/
          if-no-files-found: error
          retention-days: 90

      - name: Upload the recording passes and logs
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: record-outputs
          path: |
            out/
            !out/state-b-snapshot/
            !out/recording/
          if-no-files-found: warn

  commit:
    needs: record
    if: github.event_name == 'push' || inputs.commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the recording, and create or add to its releases
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: recording
          path: ${{ runner.temp }}/recording

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: state-b-snapshot
          path: ${{ runner.temp }}/state-b-snapshot

      - name: Put the recording in recordings/ and check it
        shell: pwsh
        run: |
          . ./scripts/runner/common.ps1
          $art = "$env:RUNNER_TEMP/recording"
          foreach ($name in 'requests.txt', 'ignored-headers.txt', 'parity-exclusions.txt', 'approved-differences.json') {
            if ((Get-FileHash "$art/$name").Hash -ne (Get-FileHash "recordings/$name").Hash) { throw "the recording was made from a different recordings/$name than this commit's" }
          }
          Remove-Item recordings/state-a, recordings/state-b -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "$art/state-a", "$art/state-b" recordings -Recurse
          Copy-Item "$art/manifest.json" recordings/manifest.json
          ./scripts/runner/verify-recordings.ps1 -ThisRun
          $m = Get-Content recordings/manifest.json -Raw | ConvertFrom-Json
          if ((Get-FolderDigest "$env:RUNNER_TEMP/state-b-snapshot") -ne $m.stateBSnapshotSha256) { throw 'the state-b-snapshot artifact does not have the digest in the manifest' }

      - name: Add the state B snapshot to the snapshots-v1 release
        shell: pwsh
        run: |
          . ./scripts/runner/common.ps1
          $m = Get-Content recordings/manifest.json -Raw | ConvertFrom-Json
          $asset = Join-Path $env:RUNNER_TEMP (Get-SnapshotAssetName 'state-b-snapshot' $m.stateBSnapshotRun)
          tar -czf $asset -C "$env:RUNNER_TEMP/state-b-snapshot" .
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          gh release upload $SnapshotRelease $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }

      - name: Keep the recording in the release recordings-<run id>
        shell: pwsh
        run: |
          # A re-run of this run finds the release already there; its asset must then be the same
          # recording, and is never replaced.
          . ./scripts/runner/common.ps1
          $tag = Get-RecordingReleaseTag "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $asset = Join-Path $env:RUNNER_TEMP "$tag.tar.gz"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $kept = Join-Path $env:RUNNER_TEMP 'kept'
            New-Item -ItemType Directory -Path $kept | Out-Null
            gh release download $tag --pattern "$tag.tar.gz" --dir $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw "release $tag exists but its asset could not be downloaded" }
            tar -xzf $asset -C $kept
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
            if ((Get-FolderDigest $kept) -ne (Get-FolderDigest "$env:RUNNER_TEMP/recording")) { throw "release $tag already holds a different recording" }
            Write-Host "release $tag already holds this recording"
          } else {
            tar -czf $asset -C "$env:RUNNER_TEMP/recording" .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
            gh release create $tag $asset --target $env:GITHUB_SHA --title "Recording of run $env:GITHUB_RUN_ID" --notes "The recordings folder committed by $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID. scripts/runner/verify-recordings.ps1 compares recordings/ with this asset."
            if ($LASTEXITCODE -ne 0) { throw 'release create failed' }
          }

      - name: Commit the recording
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A recordings/state-a recordings/state-b recordings/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'git add failed' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'recording unchanged; nothing to commit'; exit 0 }
          git commit -q -m "Record the old app's responses (run $env:GITHUB_RUN_ID)" -m "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          git pull -q --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'rebase onto main failed' }
          git push -q origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
