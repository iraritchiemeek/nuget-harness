name: old-app

# Spec 01: build, set up and run the pinned NuGetGallery on a fresh windows-2022 runner,
# seed it with real packages through its own UI forms and push API, run the done-when
# checks, snapshot the seeded state, and prove that reset gives byte-identical responses.

on:
  workflow_dispatch:
    inputs:
      skip_build_cache:
        description: Ignore the cached gallery build and run build.ps1 from source
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['**.md', 'specs/**', 'service/**', 'scripts/linux/**', '.github/workflows/new-service.yml']

env:
  GALLERY_SHA: 63e6ee4202b441e1c904d6f78fc7b070f36bc24f

jobs:
  old-app:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the gallery, or restore it from cache
        uses: ./.github/actions/gallery-build
        with:
          gallery-sha: ${{ env.GALLERY_SHA }}
          skip-cache: ${{ inputs.skip_build_cache }}

      - name: Restore cached seed packages (downloaded from nuget.org)
        id: seedcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\seed-packages
          key: seed-${{ hashFiles('seed/packages.txt') }}

      - name: Setup (gallery tools\Setup-DevEnvironment.ps1)
        run: .\scripts\runner\setup.ps1

      - name: Start IIS Express and wait for the app
        run: .\scripts\runner\start-site.ps1

      - name: Seed (register, create API key, push packages)
        id: seed
        run: .\scripts\runner\seed.ps1

      - name: Save seed packages
        if: steps.seedcache.outputs.cache-hit != 'true' && steps.seed.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\seed-packages
          key: ${{ steps.seedcache.outputs.cache-primary-key }}

      - name: Checks 1-3 (package-ids, package-versions, live)
        run: .\scripts\runner\run-checks.ps1 -Dir out\responses\seeded

      - name: Snapshot (database backups + package store)
        run: .\scripts\runner\snapshot.ps1 -Dir out\snapshot

      - name: Secret scan of the snapshot
        run: .\scripts\runner\secret-scan.ps1 -Dir out\snapshot

      - name: Upload snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seed-snapshot
          path: out/snapshot/
          if-no-files-found: error

      - name: Check 5 (change state, reset, compare bytes)
        run: |
          .\scripts\runner\push-extra.ps1
          .\scripts\runner\capture.ps1 -Dir out\responses\changed
          .\scripts\runner\reset.ps1 -Dir out\snapshot
          .\scripts\runner\capture.ps1 -Dir out\responses\reset
          .\scripts\runner\compare.ps1 -Before out\responses\seeded -Changed out\responses\changed -After out\responses\reset -CheckNumber 5 -Name 'reset is exact' -OutName spec01-check5-reset.txt

      - name: Check 7 (source and config diff)
        if: always()
        run: .\scripts\runner\source-diff.ps1

      - name: Summary
        if: always()
        run: .\scripts\runner\summary.ps1 -SeedOutcome '${{ steps.seed.outcome }}' -JobStatus '${{ job.status }}'

      - name: Diagnostics
        if: always()
        run: .\scripts\runner\diagnostics.ps1

      - name: Stop IIS Express
        if: always()
        run: .\scripts\runner\stop-site.ps1

      - name: Secret scan of the check outputs
        id: scan
        if: always()
        run: .\scripts\runner\secret-scan.ps1 -Dir out

      - name: Upload check outputs
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-outputs
          path: |
            out/
            !out/snapshot/
          if-no-files-found: warn

  # Prove the snapshot artifact restores onto a different, fresh machine: no seeding, just
  # setup, reset.ps1 from the downloaded artifact, then the same requests and checks.
  restore-on-fresh-machine:
    needs: old-app
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the gallery, or restore it from cache
        uses: ./.github/actions/gallery-build
        with:
          gallery-sha: ${{ env.GALLERY_SHA }}
          skip-cache: ${{ inputs.skip_build_cache }}

      - name: Setup (gallery tools\Setup-DevEnvironment.ps1)
        run: .\scripts\runner\setup.ps1

      - name: Download the seed snapshot from the first job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: seed-snapshot
          path: snapshot

      - name: Download the first job's responses
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: check-outputs
          path: first-job

      - name: Reset from the snapshot, then compare and check
        run: |
          .\scripts\runner\reset.ps1 -Dir snapshot
          .\scripts\runner\capture.ps1 -Dir out\responses\restored
          .\scripts\runner\compare.ps1 -Before first-job\responses\seeded -After out\responses\restored -CheckNumber 5 -Name 'snapshot restores byte-identically on a fresh machine' -OutName spec01-check5-fresh-machine.txt
          .\scripts\runner\check.ps1 -Dir out\responses\restored

      - name: Diagnostics
        if: always()
        run: .\scripts\runner\diagnostics.ps1

      - name: Stop IIS Express
        if: always()
        run: .\scripts\runner\stop-site.ps1

      - name: Secret scan of the outputs
        id: scan
        if: always()
        run: .\scripts\runner\secret-scan.ps1 -Dir out

      - name: Upload outputs
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-machine-restore-outputs
          path: out/
          if-no-files-found: warn
