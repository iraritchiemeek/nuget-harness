name: live-parity

# Spec 02 done-when 6: the old app and the new service side by side on one windows-2022 runner,
# reading the same LocalDB database, must give byte-identical answers:
#   1. state A (the seed snapshot), every recorded request
#   2. state B (seed/state-b.txt pushed through the old app), every recorded request
#   3. after more pushes through the old app (seed/live-parity-extra.txt) and distinct download
#      counts set in the database (scripts/download-counts.sql), requests the committed set does not
#      contain: scripts/live-parity-requests.txt and a seeded random set
# Run at milestones and at the end, by hand.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # download this run's service-win-x64 artifact

env:
  GALLERY_SHA: 63e6ee4202b441e1c904d6f78fc7b070f36bc24f
  GH_TOKEN: ${{ github.token }} # get-snapshot.ps1 reads the snapshots-v1 release
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # The gallery build on the Windows runner parks every .NET SDK above 9, so the service is
  # published here as a self-contained win-x64 build.
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: service/global.json
      - name: Publish (from service/, so service/global.json picks the SDK)
        working-directory: service
        run: dotnet publish src/GalleryReadService -c Release -r win-x64 --self-contained -o "$RUNNER_TEMP/service"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-win-x64
          path: ${{ runner.temp }}/service
          if-no-files-found: error

  live:
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the gallery, or restore it from cache
        uses: ./.github/actions/gallery-build
        with:
          gallery-sha: ${{ env.GALLERY_SHA }}

      - name: Setup (gallery tools\Setup-DevEnvironment.ps1)
        run: .\scripts\runner\setup.ps1

      - name: Download the seed snapshot and check its digest
        run: .\scripts\runner\get-snapshot.ps1 -State a -Dir snapshot

      - name: Download the service
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-win-x64
          path: ${{ runner.temp }}\service

      - name: Restore state A and start the old app and the service
        run: |
          .\scripts\runner\reset.ps1 -Dir snapshot
          .\scripts\runner\start-service.ps1 -ServiceDir "$env:RUNNER_TEMP\service"

      - name: 'Check 6, state A: every recorded request'
        run: .\scripts\runner\live-compare.ps1 -Requests recordings\requests.txt -Name state-a -Exclusions recordings\parity-exclusions.txt

      - name: 'State B: push seed/state-b.txt through the old app'
        if: always()
        run: .\scripts\runner\push-state-b.ps1

      - name: 'Check 6, state B: every recorded request'
        if: always()
        run: .\scripts\runner\live-compare.ps1 -Requests recordings\requests.txt -Name state-b -Exclusions recordings\parity-exclusions.txt

      - name: More pushes through the old app, download counts, and requests outside the committed set
        if: always()
        run: |
          .\scripts\runner\push-extra.ps1 -List seed\live-parity-extra.txt
          . .\scripts\runner\common.ps1
          $set = Invoke-Sql (Get-Content scripts\download-counts.sql -Raw) -Database NuGetGallery # one array of rows
          if ($set.Count -ne 32) { throw "download-counts.sql set $($set.Count) counts, expected 32" }
          Write-Summary "- download counts: 32 distinct counts set in the database (scripts/download-counts.sql)"
          .\scripts\runner\random-requests.ps1 -Seed $env:GITHUB_RUN_ID -OutFile out\random-requests.txt
          Get-Content scripts\live-parity-requests.txt, out\random-requests.txt | Set-Content out\extra-requests.txt -Encoding ascii

      - name: 'Check 6, after the extra pushes: requests the committed set does not contain'
        if: always()
        run: .\scripts\runner\live-compare.ps1 -Requests out\extra-requests.txt -Name extra

      - name: Diagnostics
        if: always()
        run: .\scripts\runner\diagnostics.ps1

      - name: Stop IIS Express and the service
        if: always()
        run: |
          .\scripts\runner\stop-site.ps1
          Get-Process GalleryReadService -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Secret scan of the outputs
        id: scan
        if: always()
        run: .\scripts\runner\secret-scan.ps1 -Dir out

      - name: Upload outputs
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-parity
          path: out/
          if-no-files-found: warn
