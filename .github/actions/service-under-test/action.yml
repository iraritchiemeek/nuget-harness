name: service-under-test
description: >
  On ubuntu-24.04: download a gallery database snapshot from the snapshots-v1 release and check its
  digest against recordings/manifest.json (scripts/runner/get-snapshot.ps1), restore it into SQL
  Server in Docker, and (unless start-service is 'false') publish the new service and start it on
  http://localhost:5080 as the read-only login `reader`.
  Leaves SA_PASSWORD and READER_PASSWORD (generated here, masked) in the job environment, and the
  service log at $RUNNER_TEMP/service.log. The caller checks out this repository first.

inputs:
  state:
    description: a (the seed snapshot) or b (the state B snapshot of the recording run)
    required: true
  start-service:
    description: "'false' to leave building and starting the service to the caller"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Download the state ${{ inputs.state }} snapshot and check its digest
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/runner/get-snapshot.ps1 -State ${{ inputs.state }} -Dir "$env:RUNNER_TEMP/snapshot"

    - name: Generate the SQL passwords
      shell: bash
      run: |
        for name in SA_PASSWORD READER_PASSWORD; do
          pw="Pw1-$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "$name=$pw" >> "$GITHUB_ENV"
        done

    - name: Start SQL Server and restore the snapshot
      shell: bash
      run: scripts/linux/sql-server.sh "$RUNNER_TEMP/snapshot"

    - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: service/global.json

    - name: Publish the service (from service/, so service/global.json picks the SDK)
      if: inputs.start-service == 'true'
      shell: bash
      working-directory: service
      run: dotnet publish src/GalleryReadService -c Release -o "$RUNNER_TEMP/publish"

    - name: Start the service as the read-only login
      if: inputs.start-service == 'true'
      shell: bash
      run: |
        export Database__ConnectionString="Server=localhost,1433;Database=NuGetGallery;User Id=reader;Password=$READER_PASSWORD;TrustServerCertificate=True"
        export ASPNETCORE_URLS=http://localhost:5080
        nohup dotnet "$RUNNER_TEMP/publish/GalleryReadService.dll" > "$RUNNER_TEMP/service.log" 2>&1 &
        for _ in $(seq 1 30); do
          if curl -sf http://localhost:5080/health > /dev/null; then echo 'service healthy'; exit 0; fi
          sleep 1
        done
        cat "$RUNNER_TEMP/service.log"; exit 1
